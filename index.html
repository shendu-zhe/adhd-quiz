<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f5f3ff">
<title>你到底是 ADHD，还是单纯精神内耗？</title>
<meta name="description" content="10 道题，测出你的注意力乱法和内耗主要来源。约 1 分钟。趣味测试，不构成诊断。">
<style>
  :root{
    --main:#5b5bd6;
    --main-d:#4441b8;
    --ink:#1f1b33;
    --ink-2:#6a6484;
    --card:#ffffff;
    --line:#e8e4f8;
    --bg1:#f1eeff;
    --bg2:#fbfaff;
    --soft:#ece8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,#fff 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));}
  .screen{display:none;animation:fade .32s ease both}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- 封面 ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:var(--main-d);background:#e7e3ff;
    padding:7px 14px;border-radius:999px;font-weight:600;letter-spacing:.02em;
  }
  h1{
    font-size:30px;line-height:1.34;margin:20px 0 0;font-weight:800;letter-spacing:-.01em;
  }
  h1 em{font-style:normal;color:var(--main);position:relative;white-space:nowrap}
  h1 em::after{
    content:"";position:absolute;left:0;right:0;bottom:2px;height:9px;
    background:#dcd5ff;border-radius:4px;z-index:-1;
  }
  .sub{margin:14px 0 0;font-size:16px;line-height:1.7;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
  .chip{
    font-size:13.5px;color:#5f5878;background:#fff;border:1px solid var(--line);
    padding:8px 13px;border-radius:12px;box-shadow:0 2px 10px rgba(120,110,200,.07);
  }
  .chip b{color:var(--ink);font-weight:700}
  .cta{
    display:block;width:100%;border:0;cursor:pointer;
    margin-top:30px;padding:18px 20px;border-radius:18px;
    font-size:18px;font-weight:800;letter-spacing:.02em;color:#fff;
    background:linear-gradient(135deg,#7b6cff,#4f43d6);
    box-shadow:0 12px 26px rgba(91,91,214,.32);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .cta:active{transform:translateY(2px) scale(.995);box-shadow:0 6px 16px rgba(91,91,214,.28)}
  .tiny{margin:16px 0 0;text-align:center;font-size:12.5px;color:#a29cb8;line-height:1.7}

  /* ---------- 答题 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2)}
  .track{height:7px;background:#e6e1ff;border-radius:999px;margin:12px 0 30px;overflow:hidden}
  .track > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#a99bff,#5b48e8);transition:width .35s cubic-bezier(.4,0,.2,1)}
  .qnum{font-size:14px;font-weight:800;color:var(--main);letter-spacing:.08em}
  .qtext{font-size:23px;line-height:1.5;font-weight:800;margin:10px 0 26px;letter-spacing:-.01em}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    text-align:left;width:100%;cursor:pointer;
    background:var(--card);border:1.5px solid #ede9fa;border-radius:16px;
    padding:17px 18px;font-size:16.5px;line-height:1.45;color:var(--ink);font-weight:500;
    box-shadow:0 3px 14px rgba(120,110,200,.07);
    transition:border-color .15s ease,transform .1s ease,background .15s ease;
  }
  .opt:active{transform:scale(.985);border-color:var(--main);background:#f7f5ff}
  .opt.picked{border-color:var(--main);background:#f2efff}

  /* ---------- 结果 ---------- */
  .resLabel{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.16em}
  .resName{font-size:33px;font-weight:900;line-height:1.24;margin:10px 0 8px;letter-spacing:-.02em}
  .resName span{color:var(--main)}
  .resTag{font-size:16.5px;font-weight:700;color:#5f5878;line-height:1.6;margin:0}
  .social{display:none;margin:10px 0 0;font-size:13.5px;color:var(--ink-2)}
  .social b{color:var(--main);font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:20px 0 0;box-shadow:0 6px 22px rgba(120,110,200,.09)}
  .card h3{margin:0 0 10px;font-size:14px;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
  .desc{margin:0;font-size:16px;line-height:1.82;color:#33304a}
  .heat{display:flex;align-items:baseline;gap:8px}
  .heat b{font-size:44px;font-weight:900;color:var(--main);letter-spacing:-.02em;line-height:1}
  .heat i{font-style:normal;font-size:14px;color:var(--ink-2)}
  .heatTag{
    font-size:12.5px;font-weight:800;color:var(--main-d);background:#ece8ff;
    padding:4px 10px;border-radius:999px;margin-left:8px;align-self:center;
  }
  .bars{display:flex;flex-direction:column;gap:13px;margin-top:6px}
  .bar .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;color:#43405c}
  .bar .row span:last-child{font-weight:800;color:var(--main-d)}
  .bar .bg{height:9px;background:#ebe7fb;border-radius:999px;overflow:hidden}
  .bar .bg > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#b3a6ff,#5445d8);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .btn2{
    display:block;width:100%;border:1.5px solid var(--main);cursor:pointer;margin-top:14px;
    padding:15px;border-radius:16px;font-size:16px;font-weight:800;color:var(--main);
    background:#fff;transition:background .15s ease;
  }
  .btn2:active{background:#f2efff}
  .btnGhost{border-color:#e2dff1;color:var(--ink-2)}
  .foot{margin:22px 0 0;text-align:center;font-size:12px;color:#a8a2bd;line-height:1.8}
  .toast{
    position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);
    background:rgba(31,27,51,.92);color:#fff;font-size:14px;padding:11px 18px;border-radius:12px;
    opacity:0;pointer-events:none;transition:.25s ease;z-index:9;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <div class="badge">✦ 10 道题 · 约 1 分钟</div>
    <h1>你到底是 <em>ADHD</em>，还是单纯<em>精神内耗</em>？</h1>
    <p class="sub">测出你的注意力乱法，和每天偷偷耗你电的那件事。<br>凭第一直觉选，不用想太久。</p>
    <div class="chips">
      <div class="chip"><b>注意力</b>｜你的开关长在哪</div>
      <div class="chip"><b>启动阻力</b>｜为什么总开不了工</div>
      <div class="chip"><b>脑内弹幕</b>｜一天演多少场</div>
      <div class="chip"><b>内耗指数</b>｜电到底漏在哪</div>
    </div>
    <button class="cta" id="start">开始测试 →</button>
    <p class="tiny">纯本地计算 · 不收集任何信息<br>趣味测试，不构成诊断或医疗建议</p>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz">
    <div class="topbar">
      <span id="qidx">第 1 / 10 题</span>
      <span id="qpct">0%</span>
    </div>
    <div class="track"><i id="bar"></i></div>
    <div class="qnum" id="qnum">Q1</div>
    <h2 class="qtext" id="qtext">题目</h2>
    <div class="opts" id="opts"></div>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div class="resLabel">你的注意力类型</div>
    <h1 class="resName" id="rname">—</h1>
    <p class="resTag" id="rtag"></p>
    <p class="social" id="rsocial"></p>

    <div class="card">
      <h3>你的日常是什么样</h3>
      <p class="desc" id="rdesc"></p>
    </div>

    <div class="card">
      <h3>内耗指数</h3>
      <div class="heat"><b id="rheat">0</b><i>%</i><span class="heatTag" id="rheatTag"></span></div>
      <div class="bars" id="rbars"></div>
    </div>

    <button class="btn2" id="share">复制结果，发给朋友 →</button>
    <button class="btn2 btnGhost" id="again">再测一次</button>
    <p class="foot">答案只在你手机里算，不上传任何信息<br>本测试仅供娱乐，不构成诊断或医疗建议<br>如果已经影响生活，去正规医院精神科或心理科看看<br>比任何测试都值得</p>
  </section>

</div>
<div class="toast" id="toast">已复制</div>

<script>
/* __DATA_START__ */
/* ============================================================
   1. 结果类型：name 名字 / tag 一句话 / desc 解读
   ============================================================ */
const TYPES = {

    tag: "不是不想做，是没到 deadline 就打不开。",
    desc: "你的大脑只在“有点悬”的时候才肯启动。平静的日子里你像断了电，一有截止日期、一有人在等、一有赌注，又能突然爆发出别人一个月的量。这不是懒，是你的启动开关长在了外面。试着做两件事：把大任务切成 20 分钟就能看见结果的小块；开工前给自己一个小赌注——约好几点交给谁、或者找个朋友坐旁边。你会发现，自己没那么废。"
  },

    desc: "你不是拖延，你是被“必须做好”卡住了。开工前你想先准备好、先想清楚、先有个完整方案，结果准备阶段无限延长，越拖越自责，越自责越不敢看。你怕的不是做不完，是做得不够好。把标准从“完成得很好”降到“先做个丑的”：先出一版烂的，再改。完美不是开始的前提，是改出来的结果。"

  },
  drift: {
    name: "随缘发散型",
    tag: "注意力确实会跑，但你不怎么为它自责。",
    desc: "你也会走神、会忘事、会把手机从手里放下又找一圈，但你不太为这些内耗。这让你在网上那些“ADHD 自测”里很容易对号入座，其实你只是普通的分心。你的优势是恢复力：跑偏了能自己回来，摔了也不太记仇。别被别人的诊断叙事带走——你大概率不缺病，缺的可能只是睡够觉、少熬一次夜。"

/* ------------------------------------------------------------
   配平系数：题库里每种类型能拿分的题数不一样，直接相加会有人
   永远抽不到。这组数是用 3 万次随机作答模拟搜出来的，保证六种
   结果都在 16%–18% 之间。改题目后要重跑一次模拟。
   ------------------------------------------------------------ */
const TYPE_W = { stim: 0.87, danmu: 1.51, perfect: 0.96, rumin: 1.23, mask: 0.81, drift: 1.32 };

/* ============================================================
   2. 维度：显示在结果页的成分条
   ============================================================ */
const DIMS = {
  drift: "注意力漂移",
  start: "启动阻力",
  mono: "脑内弹幕",
  drain: "情绪耗电"
};

/* ============================================================
   3. 题目：每题 4 个选项，s 给类型加分，d 给维度加分
   ============================================================ */
const QUESTIONS = [
  {
    q: "闹钟响了，接下来十分钟你通常在干嘛？",

      { t: "挺安静的，很快就睡了", s: { drift: 1 }, d: {} }
    ]
  },

      { t: "看一眼，想着待会回，然后就忘了", s: { danmu: 1 }, d: { drift: 2 } },

/* ============================================================
   4. 逻辑
   ============================================================ */

/* ---------- 后端计数（可选，失败不影响测试） ---------- */
const SITE_ID = "adhd";
const API_BASE = "https://quiz-api-pages.pages.dev"; // Cloudflare Pages Functions 后端
async function reportCount(site, typeId) {
  if (!API_BASE) return;
  const el = document.getElementById("rsocial");
  if (!el) return;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch(`${API_BASE}/api/count`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ site, type: typeId }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    const d = await r.json();
    if (d && d.ok && d.typeCount > 1) {
      el.innerHTML = `已经有 <b>${d.typeCount.toLocaleString()}</b> 人和你测出一样的结果`;
      el.style.display = "block";
    }
  } catch (e) {
    /* 后端不可用时静默 */
  }
}

const picked = [];
const $ = (id) => document.getElementById(id);
const show = (id) => {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
};

function renderQuestion() {
  const i = picked.length;
  const q = QUESTIONS[i];
  $("qidx").textContent = `第 ${i + 1} / ${QUESTIONS.length} 题`;
  const pct = Math.round((i / QUESTIONS.length) * 100);
  $("qpct").textContent = pct + "%";
  $("bar").style.width = pct + "%";
  $("qnum").textContent = "Q" + (i + 1);
  $("qtext").textContent = q.q;
  const box = $("opts");
  box.innerHTML = "";
  q.o.forEach((opt, idx) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt.t;
    b.onclick = () => {
      b.classList.add("picked");
      picked.push(idx);
      setTimeout(() => {
        if (picked.length < QUESTIONS.length) renderQuestion();
        else renderResult();
      }, 170);
    };
    box.appendChild(b);
  });
}

/* 每个维度的理论最大值，从题库自动算，改题不用手动改数 */
const DIM_MAX = (() => {
  const m = {};
  Object.keys(DIMS).forEach((k) => (m[k] = 0));
  QUESTIONS.forEach((q) => {
    Object.keys(DIMS).forEach((k) => {
      m[k] += Math.max(...q.o.map((o) => (o.d && o.d[k]) || 0));
    });
  });
  return m;
})();

function renderResult() {
  const score = {};
  const dims = {};
  picked.forEach((idx, qi) => {
    const opt = QUESTIONS[qi].o[idx];
    for (const k in opt.s) score[k] = (score[k] || 0) + opt.s[k];
    for (const k in opt.d) dims[k] = (dims[k] || 0) + opt.d[k];
  });

  let best = "stim", bestScore = -1;
  const order = ["stim", "danmu", "perfect", "rumin", "mask", "drift"];
  order.forEach((k) => {
    const v = (score[k] || 0) * (TYPE_W[k] || 1);
    if (v > bestScore) { bestScore = v; best = k; }
  });
  const type = TYPES[best];

  /* 内耗指数：越偏“反刍 / 伪装 / 完美”越高，越偏“随缘”越低 */
  const total = Object.values(score).reduce((a, b) => a + b, 0) || 1;
  const raw = (
    (score.rumin || 0) * 1.0 +
    (score.mask || 0) * 1.0 +
    (score.perfect || 0) * 0.85 +
    (score.stim || 0) * 0.7 +
    (score.danmu || 0) * 0.6 +
    (score.drift || 0) * 0.15
  ) / total * 100;
  const heat = Math.max(8, Math.min(97, Math.round(58 + (raw - 75) * 2.6)));
  const heatTag = heat < 40 ? "低内耗" : heat < 60 ? "中等" : heat < 78 ? "偏高" : "很高";

  $("rname").textContent = type.name;
  $("rtag").textContent = type.tag;
  $("rdesc").textContent = type.desc;
  $("rheat").textContent = heat;
  $("rheatTag").textContent = heatTag;

  $("rbars").innerHTML = "";
  Object.keys(DIMS).forEach((k) => {
    const v = dims[k] || 0;
    const p = Math.max(8, Math.min(98, Math.round((v / (DIM_MAX[k] || 1)) * 100)));
    const row = document.createElement("div");
    row.className = "bar";
    row.innerHTML = `<div class="row"><span>${DIMS[k]}</span><span>${p}%</span></div><div class="bg"><i style="width:0"></i></div>`;
    $("rbars").appendChild(row);
    requestAnimationFrame(() => setTimeout(() => { row.querySelector("i").style.width = p + "%"; }, 60));
  });

  $("bar").style.width = "100%";
  $("qpct").textContent = "100%";
  show("s-result");

  window.__shareText = `我测出来是「${type.name}」——${type.tag} 你的是哪一种？`;
  reportCount(SITE_ID, best);
}

$("start").onclick = () => {
  picked.length = 0;
  $("bar").style.width = "0%";
  renderQuestion();
  show("s-quiz");
};

$("again").onclick = () => {
  picked.length = 0;
  show("s-cover");
};

$("share").onclick = async () => {
  const text = window.__shareText || document.title;
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制，去发给朋友吧");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast("已复制，去发给朋友吧");
  }
};

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1600);
}
</script>
